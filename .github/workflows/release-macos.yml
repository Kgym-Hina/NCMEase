name: Release macOS app

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: xcode-27

    env:
      PROJECT: NCMEase.xcodeproj
      TARGET: NCMEase

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build universal macOS app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -target "$TARGET" \
            -configuration Release \
            -sdk macosx \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/NCMEaseBuild" \
            build

      - name: Package app as zip
        id: package
        shell: bash
        run: |
          set -euo pipefail

          app_path="$RUNNER_TEMP/NCMEaseBuild/NCMEase.app"
          test -d "$app_path"

          binary_path="$app_path/Contents/MacOS/NCMEase"
          test -f "$binary_path"
          archs="$(lipo -archs "$binary_path")"
          [[ "$archs" == *arm64* ]]
          [[ "$archs" == *x86_64* ]]

          mkdir -p dist
          safe_tag_name="${GITHUB_REF_NAME//\//-}"
          zip_path="$PWD/dist/NCMEase-${safe_tag_name}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$zip_path"

          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Verify zip contents
        shell: bash
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          set -euo pipefail
          unzip -l "$ZIP_PATH"
          unzip -l "$ZIP_PATH" | grep -q 'NCMEase.app/Contents/Info.plist'

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload \
              "$GITHUB_REF_NAME" \
              "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create \
              "$GITHUB_REF_NAME" \
              "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NCMEase $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
